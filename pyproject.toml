[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "scanpy-kernels"
version = "0.1.0"
description = "Rust-accelerated, numerically-verified kernels for Scanpy"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Dishant" }]
keywords = ["scanpy", "single-cell", "rust", "pyo3", "scrnaseq"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/Dishant707/scanpy-kernels"
Repository = "https://github.com/Dishant707/scanpy-kernels"

[project.optional-dependencies]
test = ["pytest", "hypothesis", "scanpy"]

[tool.maturin]
python-source = "python"
module-name = "scanpy_kernels._core"
features = ["pyo3/extension-module"]
