[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "scanpy-kernels"
version = "0.1.0"
description = "Rust-accelerated, numerically-verified kernels for Scanpy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Dishant" }]
keywords = ["scanpy", "single-cell", "rust", "pyo3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest", "hypothesis", "scanpy"]

[tool.maturin]
python-source = "python"
module-name = "scanpy_kernels._core"
features = ["pyo3/extension-module"]
