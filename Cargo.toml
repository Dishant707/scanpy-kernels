[package]
name = "scanpy-kernels"
version = "0.1.0"
edition = "2021"
description = "Rust-accelerated kernels for Scanpy (correctness-first)"
license = "BSD-3-Clause"
repository = "https://github.com/Dishant707/scanpy-kernels"
keywords = ["scanpy", "single-cell", "rust", "pyo3"]
categories = ["science"]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
